[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-draw"
version = "0.1.1"
description = "Mac-local client for a LAN-hosted image-generation bridge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "John Hoaglun"}]

[project.scripts]
mac-draw = "mac_draw.cli:main"
picture = "mac_draw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
